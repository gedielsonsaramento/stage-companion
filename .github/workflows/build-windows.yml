name: Build Stage Companion

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Build server
        shell: cmd
        run: BUILD-WINDOWS.cmd
      - name: Package plugin
        shell: powershell
        run: Compress-Archive -Path plugin\* -DestinationPath StageCompanion-DEV-Teste08G-C3.zip -Force
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StageCompanion-08G-C3
          path: |
            StageCompanion-Servidor-08G-R9.exe
            StageCompanion-DEV-Teste08G-C3.zip
            themes\Retorno-StageCompanion-08G-C3.spresenter-theme.json
            INSTALL.md
            CHANGELOG.md
